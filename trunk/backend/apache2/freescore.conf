# Enable: proxy_module, proxy_http_module, proxy_wstunnel_module
<VirtualHost *:80>
	DocumentRoot "/var/www/html"
	ServerName freescore.net

	# --------------------------------------------------------
	# WebSocket proxy — each service path routes to its backend
	# --------------------------------------------------------
	<Location /worldclass/request>
		ProxyPass ws://localhost:3088/worldclass
		ProxyPassReverse ws://localhost:3088/worldclass
		Order allow,deny
		Allow from all
	</Location>
	<Location /grassroots/request>
		ProxyPass ws://localhost:3080/grassroots
		ProxyPassReverse ws://localhost:3080/grassroots
		Order allow,deny
		Allow from all
	</Location>
	<Location /freestyle/request>
		ProxyPass ws://localhost:3082/freestyle
		ProxyPassReverse ws://localhost:3082/freestyle
		Order allow,deny
		Allow from all
	</Location>
	<Location /breaking/request>
		ProxyPass ws://localhost:3078/breaking
		ProxyPassReverse ws://localhost:3078/breaking
		Order allow,deny
		Allow from all
	</Location>
	<Location /para/request>
		ProxyPass ws://localhost:3089/para
		ProxyPassReverse ws://localhost:3089/para
		Order allow,deny
		Allow from all
	</Location>
	<Location /vsparring/request>
		ProxyPass ws://localhost:3095/vsparring
		ProxyPassReverse ws://localhost:3095/vsparring
		Order allow,deny
		Allow from all
	</Location>
	# fswifi backend route is /setup/:database, not /freescore/:database
	<Location /fswifi/request>
		ProxyPass ws://localhost:3085/setup
		ProxyPassReverse ws://localhost:3085/setup
		Order allow,deny
		Allow from all
	</Location>

	# --------------------------------------------------------
	# HTTP proxy — status health checks (/service/status)
	# --------------------------------------------------------
	<Location /worldclass/status>
		ProxyPass http://localhost:3088/status
		ProxyPassReverse http://localhost:3088/status
	</Location>
	<Location /grassroots/status>
		ProxyPass http://localhost:3080/status
		ProxyPassReverse http://localhost:3080/status
	</Location>
	<Location /freestyle/status>
		ProxyPass http://localhost:3082/status
		ProxyPassReverse http://localhost:3082/status
	</Location>
	<Location /breaking/status>
		ProxyPass http://localhost:3078/status
		ProxyPassReverse http://localhost:3078/status
	</Location>
	<Location /fswifi/status>
		ProxyPass http://localhost:3085/status
		ProxyPassReverse http://localhost:3085/status
	</Location>
	<Location /para/status>
		ProxyPass http://localhost:3089/status
		ProxyPassReverse http://localhost:3089/status
	</Location>
	<Location /vsparring/status>
		ProxyPass http://localhost:3095/status
		ProxyPassReverse http://localhost:3095/status
	</Location>

	# --------------------------------------------------------
	# HTTP proxy — REST/webservice endpoints (/service/webservice/...)
	# Trailing slash strips the location prefix so the backend sees
	# /{tournament}/{ring}/... directly.
	# --------------------------------------------------------
	<Location /grassroots/webservice>
		ProxyPass http://localhost:3080/
		ProxyPassReverse http://localhost:3080/
	</Location>
	<Location /breaking/webservice>
		ProxyPass http://localhost:3078/
		ProxyPassReverse http://localhost:3078/
	</Location>
</VirtualHost>
